<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Tools</title>
    <link rel="stylesheet" href="./assets/ui.css">
    <style>
        .tool-list {
            display: grid;
            gap: 0.6rem;
        }

        .tool {
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            align-items: center;
            gap: 0.9rem;
            padding: 1.05rem 1.1rem;
            background: var(--panel);
            border: var(--bd) solid var(--line);
            transition: transform var(--speed) linear, box-shadow var(--speed) linear,
                border-color var(--speed) linear;
        }

        .tool:hover {
            transform: var(--lift);
            border-color: var(--accent);
            box-shadow: var(--stamp-accent);
        }

        .tool-index {
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--muted);
            transition: color var(--speed) linear;
        }

        .tool-icon {
            display: inline-flex;
            color: var(--muted);
            transition: color var(--speed) linear;
        }

        .tool-icon .icon {
            width: 16px;
            height: 16px;
            stroke-width: 2.4;
        }

        .tool-name {
            font-size: 0.92rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .tool-arrow {
            font-family: var(--mono);
            color: var(--muted);
            transition: color var(--speed) linear, transform var(--speed) linear;
        }

        .tool:hover .tool-index,
        .tool:hover .tool-icon,
        .tool:hover .tool-arrow {
            color: var(--accent);
        }

        .tool:hover .tool-arrow {
            transform: translateX(3px);
        }
    </style>
</head>

<body>
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="i-key" viewBox="0 0 24 24">
            <circle cx="6" cy="12" r="3.5" />
            <path d="M9.5 12H21M16 12v3.5M19.5 12v2.5" />
        </symbol>
        <symbol id="i-tv" viewBox="0 0 24 24">
            <rect x="2.5" y="4" width="19" height="13" />
            <path d="M10 8.5 15.5 10.75 10 13z" />
            <path d="M8.5 20.5h7M12 17v3.5" />
        </symbol>
        <symbol id="i-code" viewBox="0 0 24 24">
            <path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5M13.5 4.5 10.5 19.5" />
        </symbol>
        <symbol id="i-qr" viewBox="0 0 24 24">
            <rect x="3.5" y="3.5" width="6.5" height="6.5" />
            <rect x="14" y="3.5" width="6.5" height="6.5" />
            <rect x="3.5" y="14" width="6.5" height="6.5" />
            <path d="M14 20.5h6.5V14" />
        </symbol>
    </svg>

    <div class="container">
        <header class="header">
            <p class="kicker">Local Toolset</p>
            <h1>Developer Tools</h1>
        </header>

        <nav class="tool-list">
            <a class="tool" href="/2fa">
                <span class="tool-index">01</span>
                <span class="tool-icon"><svg class="icon icon--tight" aria-hidden="true"><use href="#i-key" /></svg></span>
                <span class="tool-name">Temporary 2FA / TOTP</span>
                <span class="tool-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <a class="tool" href="/tv.html">
                <span class="tool-index">02</span>
                <span class="tool-icon"><svg class="icon icon--tight" aria-hidden="true"><use href="#i-tv" /></svg></span>
                <span class="tool-name">TV Streamer</span>
                <span class="tool-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <a class="tool" href="/htmlbeauty">
                <span class="tool-index">03</span>
                <span class="tool-icon"><svg class="icon icon--tight" aria-hidden="true"><use href="#i-code" /></svg></span>
                <span class="tool-name">HTML Beautifier</span>
                <span class="tool-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <a class="tool" href="/qris.html">
                <span class="tool-index">04</span>
                <span class="tool-icon"><svg class="icon icon--tight" aria-hidden="true"><use href="#i-qr" /></svg></span>
                <span class="tool-name">QRIS Parser &amp; Dynamic Generator</span>
                <span class="tool-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <!-- Tambah tool lain di sini -->
        </nav>
    </div>
</body>

</html>
