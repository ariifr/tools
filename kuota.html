<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Kuota Axis XL — Developer Tools</title>
    <meta name="description"
        content="Cek sisa kuota, masa aktif, dan status kartu Axis/XL dari nomor MSISDN.">
    <link rel="stylesheet" type="text/css" href="./assets/ui.css">
    <link rel="stylesheet" type="text/css" href="./assets/kuota/kuota.css">
</head>

<body>
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="i-signal" viewBox="0 0 24 24">
            <path d="M4 20v-4M9 20v-8M14 20v-12M19 20V4" />
        </symbol>
        <symbol id="i-tower" viewBox="0 0 24 24">
            <path d="M8.5 9a5 5 0 0 1 7 0M5.5 6.5a9 9 0 0 1 13 0" />
            <path d="M12 12v8.5M9.5 20.5h5" />
            <circle cx="12" cy="10.5" r="1.5" />
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
            <path d="M12 3.5 19.5 6v6c0 4.5-3 7.5-7.5 9-4.5-1.5-7.5-4.5-7.5-9V6z" />
            <path d="m8.5 12 2.5 2.5 4.5-5" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 7v5.5l3.5 2" />
        </symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24">
            <rect x="3.5" y="5.5" width="17" height="15" />
            <path d="M3.5 10.5h17M8 3.5v4M16 3.5v4" />
        </symbol>
        <symbol id="i-hourglass" viewBox="0 0 24 24">
            <path d="M7 3.5h10M7 20.5h10" />
            <path d="M8.5 3.5c0 4 3.5 5.5 3.5 8.5s-3.5 4.5-3.5 8.5M15.5 3.5c0 4-3.5 5.5-3.5 8.5s3.5 4.5 3.5 8.5" />
        </symbol>
        <symbol id="i-sim" viewBox="0 0 24 24">
            <path d="M5 3.5h9.5L19.5 8.5v12H5z" />
            <path d="M9 11.5h6v6H9z" />
            <path d="M9 14.5h6M12 11.5v6" />
        </symbol>
        <symbol id="i-database" viewBox="0 0 24 24">
            <ellipse cx="12" cy="6" rx="7.5" ry="3" />
            <path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6" />
            <path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3" />
        </symbol>
        <symbol id="i-globe" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M3.5 12h17" />
            <path d="M12 3.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z" />
        </symbol>
        <symbol id="i-phone" viewBox="0 0 24 24">
            <path
                d="M21.5 16.9v2.6a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.6 3.8a2 2 0 0 1 2-2.2h2.6a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L7.1 9.4a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z" />
        </symbol>
        <symbol id="i-message" viewBox="0 0 24 24">
            <path d="M3.5 5.5h17v11h-10l-4.5 3.5v-3.5H3.5z" />
            <path d="M7.5 9.5h9M7.5 12.5h5" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m15.5 15.5 5 5" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
            <path d="M12 3.5 22 20.5H2z" />
            <path d="M12 9.5v5M12 17.4v.01" />
        </symbol>
    </svg>

    <div class="kuota-container">
        <div class="nav-header">
            <a href="./index.html" class="back-link">&larr; Kembali ke Beranda</a>
            <span class="label">Third-Party API</span>
        </div>

        <h1 class="page-title with-icon">
            <svg class="icon" aria-hidden="true"><use href="#i-signal" /></svg>
            Cek Kuota Axis XL
        </h1>
        <p class="page-subtitle">Masukkan nomor Axis/XL untuk melihat sisa kuota, masa aktif, dan status
            kartu.</p>

        <div class="card">
            <div class="card-title">
                <span>Nomor MSISDN</span>
            </div>

            <form id="checkForm" class="check-form" novalidate>
                <div class="input-wrapper">
                    <input type="tel" id="msisdnInput" name="msisdn" inputmode="numeric" autocomplete="off"
                        placeholder="08xxxxxxxxxx" aria-label="Nomor MSISDN" maxlength="16">
                </div>
                <button type="submit" class="btn-primary" id="checkBtn">
                    <svg class="icon icon--tight" aria-hidden="true"><use href="#i-search" /></svg>
                    <span id="checkBtnLabel">Cek Kuota</span>
                </button>
            </form>

            <p class="hint">Format: 08xx, 628xx, atau +628xx.</p>

            <div id="statusBanner" class="status-banner" role="alert" aria-live="polite">
                <span aria-hidden="true"><svg class="icon"><use href="#i-alert" /></svg></span>
                <span id="statusText"></span>
            </div>
        </div>

        <div id="results" class="hidden">
            <div class="card">
                <div class="card-title">
                    <span class="with-icon">
                        <svg class="icon icon--tight" aria-hidden="true"><use href="#i-sim" /></svg>
                        Informasi Kartu
                    </span>
                    <span class="badge badge-static mono" id="msisdnBadge">-</span>
                </div>
                <div class="info-grid" id="infoGrid"></div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span class="with-icon">
                        <svg class="icon icon--tight" aria-hidden="true"><use href="#i-database" /></svg>
                        Paket &amp; Kuota
                    </span>
                    <span class="label" id="packageCount"></span>
                </div>
                <div class="package-list" id="packageList"></div>
            </div>
        </div>
    </div>

    <script src="./assets/kuota/kuota.js"></script>
</body>

</html>
