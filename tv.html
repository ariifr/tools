<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Streamer</title>
    <link rel="stylesheet" type="text/css" href="assets/ui.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="assets/tv/tv.css">
</head>

<body>
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="i-upload" viewBox="0 0 24 24">
            <path d="M12 16V4M7.5 8.5 12 4l4.5 4.5" />
            <path d="M4 16v4h16v-4" />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
            <path d="M8 5.5 19 12 8 18.5z" />
        </symbol>
    </svg>

    <div class="container">
        <div class="header">
            <p class="kicker">M3U8 / HLS Player</p>
            <h1>TV Streamer</h1>
        </div>

        <!-- 1. Video Player Section -->
        <div id="playerArea" class="hidden">
            <div class="now-playing" id="nowPlaying">NO STREAM</div>
            <div class="player-wrapper">
                <video id="my-video" class="video-js vjs-fluid vjs-big-play-centered" controls preload="auto"
                    playsinline></video>
            </div>
        </div>

        <!-- 2. Button Default Playlist -->
        <div class="default-playlists">
            <button class="default-btn"
                onclick="loadDefaultPlaylist('https://iptv-org.github.io/iptv/index.m3u')">Playlist IPTV
                Global</button>
            <button class="default-btn"
                onclick="loadDefaultPlaylist('https://iptv-org.github.io/iptv/countries/id.m3u')">Playlist IPTV
                Indonesia</button>
        </div>

        <!-- 3. Form Custom Playlist -->
        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="streamInput" placeholder="Enter M3U8 stream or playlist URL"
                    autocomplete="off">
                <div class="input-actions">
                    <label for="fileInput" class="icon-btn" title="Upload an M3U file"
                        aria-label="Upload an M3U file">
                        <svg class="icon" aria-hidden="true"><use href="#i-upload" /></svg>
                    </label>
                    <input type="file" id="fileInput" accept=".m3u,.m3u8" style="display: none;">
                    <button type="button" class="icon-btn" onclick="loadInput()" title="Play / load"
                        aria-label="Play / load">
                        <svg class="icon" aria-hidden="true"><use href="#i-play" /></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <!-- 4. Playlist Below Form -->
        <div id="playlistArea" class="hidden">
            <div class="search-wrapper hidden" id="searchWrapper">
                <input type="text" id="channelSearch" placeholder="Search channels..." autocomplete="off">
            </div>

            <div id="channelList" class="channel-list"></div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@videojs/http-streaming@3.13.0/dist/videojs-http-streaming.min.js"></script>
    <script>
        let player = null;
        let allChannels = [];
        const streamInput = document.getElementById('streamInput');
        const fileInput = document.getElementById('fileInput');
        const playerArea = document.getElementById('playerArea');
        const playlistArea = document.getElementById('playlistArea');
        const channelList = document.getElementById('channelList');
        const nowPlaying = document.getElementById('nowPlaying');
        const errorEl = document.getElementById('errorMessage');
        const searchWrapper = document.getElementById('searchWrapper');
        const channelSearch = document.getElementById('channelSearch');

        function initPlayer() {
            if (!player) {
                player = videojs('my-video', {
                    fluid: true,
                    aspectRatio: '16:9',
                    controls: true,
                    html5: {
                        vhs: {
                            overrideNative: true,
                        },
                    },
                });
                player.on('error', function () {
                    showError('Failed to load stream. Check the URL or CORS policy.');
                });
            }
        }

        function playStream(url, name) {
            initPlayer();
            hideError();
            playerArea.classList.remove('hidden');
            nowPlaying.textContent = name;

            player.src({
                src: url,
                type: 'application/x-mpegURL',
            });
            player.play().catch(e => console.warn('Autoplay prevented', e));
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }

        function hideError() {
            errorEl.classList.remove('show');
        }

        function renderChannelList(channels) {
            channelList.innerHTML = '';
            if (channels.length === 0) return;

            channels.forEach((ch) => {
                const btn = document.createElement('div');
                btn.className = 'channel-item';
                btn.textContent = ch.name;
                btn.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playStream(ch.url, ch.name);
                };
                channelList.appendChild(btn);
            });
            playlistArea.classList.remove('hidden');
        }

        function handlePlaylistContent(text) {
            const lines = text.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const splitIdx = line.indexOf(',');
                    const name = splitIdx !== -1 ? line.substring(splitIdx + 1).trim() : 'Unknown';
                    currentChannel.name = name || 'Unknown';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            }

            if (channels.length > 0) {
                allChannels = channels;
                searchWrapper.classList.remove('hidden');
                channelSearch.value = '';
                renderChannelList(channels);
                // Auto play first channel
                const firstBtn = channelList.querySelector('.channel-item');
                if (firstBtn) firstBtn.click();
            } else {
                showError('No channels found in playlist.');
            }
        }

        async function loadUrl(url) {
            hideError();
            try {
                // First try to fetch to see if it's an IPTV playlist
                const res = await fetch(url);
                const text = await res.text();
                if (text.includes('#EXTINF')) {
                    handlePlaylistContent(text);
                    return;
                }
            } catch (e) {
                console.log("Fetch failed or not a playlist, trying to play directly.", e);
            }

            // If fetch fails (CORS) or it doesn't contain #EXTINF, play directly
            allChannels = [];
            searchWrapper.classList.add('hidden');
            channelList.innerHTML = '';
            playlistArea.classList.add('hidden');
            playStream(url, 'Custom Stream');
        }

        async function loadInput() {
            const val = streamInput.value.trim();
            if (!val) {
                showError('Please enter a URL');
                return;
            }
            await loadUrl(val);
        }

        function loadDefaultPlaylist(url) {
            loadUrl(url);
        }

        channelSearch.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(term));
            renderChannelList(filtered);
        });

        streamInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadInput();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            hideError();
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                if (text.includes('#EXTM3U')) {
                    handlePlaylistContent(text);
                } else {
                    showError('Invalid M3U playlist file.');
                }
            };
            reader.readAsText(file);
            // reset file input
            fileInput.value = '';
        });

        // Automatically load and play the first default playlist on page load
        const firstDefaultBtn = document.querySelector('.default-btn');
        if (firstDefaultBtn) {
            firstDefaultBtn.click();
        }

    </script>
</body>

</html>
